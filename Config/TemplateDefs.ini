[/Script/GameProjectGeneration.TemplateProjectDefs]

Categories=Games

LocalizedDisplayNames=(Language="en",Text="MR Quest 3 (Passthrough + Hands)")
LocalizedDescriptions=(Language="en",Text="C++ Mixed Reality template for Meta Quest 3 / 3S. Persistent passthrough as the background and hand tracking with Meta XR Interaction SDK hand rigs (grab, poke, ray). Android / Quest settings are preconfigured. Requires the Meta XR and Meta XR Interaction SDK plugins installed in the engine.")

LocalizedDisplayNames=(Language="pl",Text="MR Quest 3 (Passthrough + dłonie)")
LocalizedDescriptions=(Language="pl",Text="Szablon C++ Mixed Reality dla Meta Quest 3 / 3S. Passthrough jako tło i śledzenie dłoni z rigami Meta XR Interaction SDK (grab, poke, ray). Ustawienia Androida / Questa gotowe. Wymaga pluginów Meta XR i Meta XR Interaction SDK zainstalowanych w silniku.")

; This project uses a thumbnail as the project icon
bThumbnailAsIcon=true

ClassTypes=Pawn, GameMode
AssetTypes=Level

FoldersToIgnore=Binaries
FoldersToIgnore=Build
FoldersToIgnore=Intermediate
FoldersToIgnore=Saved
FoldersToIgnore=Media
FoldersToIgnore=DerivedDataCache
FoldersToIgnore=.vs
FoldersToIgnore=.idea
FoldersToIgnore=.git
FoldersToIgnore=docs
FoldersToIgnore=scripts

FilesToIgnore="%TEMPLATENAME%.uproject"
FilesToIgnore="%TEMPLATENAME%.png"
FilesToIgnore="%TEMPLATENAME%.sln"
FilesToIgnore="Config/TemplateDefs.ini"
FilesToIgnore="Config/config.ini"
FilesToIgnore="Manifest.json"
FilesToIgnore="contents.txt"
FilesToIgnore="CLAUDE.md"
FilesToIgnore="README.md"
FilesToIgnore="LICENSE"
FilesToIgnore=".gitignore"
FilesToIgnore=".gitattributes"

FolderRenames=(From="Source/%TEMPLATENAME%",To="Source/%PROJECTNAME%")
FolderRenames=(From="Source/%TEMPLATENAME%Editor",To="Source/%PROJECTNAME%Editor")

FilenameReplacements=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME_UPPERCASE%",To="%PROJECTNAME_UPPERCASE%",bCaseSensitive=true)
FilenameReplacements=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME_LOWERCASE%",To="%PROJECTNAME_LOWERCASE%",bCaseSensitive=true)
FilenameReplacements=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME%",To="%PROJECTNAME%",bCaseSensitive=false)

ReplacementsInFiles=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME_UPPERCASE%",To="%PROJECTNAME_UPPERCASE%",bCaseSensitive=true)
ReplacementsInFiles=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME_LOWERCASE%",To="%PROJECTNAME_LOWERCASE%",bCaseSensitive=true)
ReplacementsInFiles=(Extensions=("cpp","h","ini","cs"),From="%TEMPLATENAME%",To="%PROJECTNAME%",bCaseSensitive=false)

SortKey=MRQuest
FocusAsset=/Game/MRTemplate/Maps/L_MR

; Ustawienia (C++, Mobile, Scalable, XR) są już w Config – nie pokazujemy ich w kreatorze.
HiddenSettings=Languages
HiddenSettings=HardwareTarget
HiddenSettings=GraphicsPreset
HiddenSettings=XR
